# QindaQt boot menu settings, read by qinda-boot-sync.
# Run `qinda-boot-sync` after editing; kernel updates run it automatically.

# Seconds the menu waits before starting the default mode. 0 waits until
# a choice is made; -1 starts the default at once unless a key is held.
TIMEOUT=5

# Mode booted when the timer runs out: a file name in modes.d without its
# number, e.g. qindaqt or llm-server.
DEFAULT_MODE=qindaqt

# Artwork size: auto picks 2x for displays wider than 1920 pixels.
SCALE=auto

# Firmware display mode for the menu: max, or e.g. "1920 1080".
RESOLUTION=max

# Kernel arguments every menu entry adds for the Plymouth splash. The
# "Text boot (no splash)" option in each entry's submenu leaves them out.
SPLASH_OPTIONS="quiet splash loglevel=3 rd.udev.log_level=3 systemd.show_status=auto rd.systemd.show_status=auto"

# systemd-boot, behind the menu's "Advanced" row, lists loaders it finds on
# its own (e.g. a leftover Windows Boot Manager). "no" hides them, "yes"
# shows them, "keep" leaves systemd-boot's loader.conf alone.
SYSTEMD_BOOT_AUTO_ENTRIES=no
