# The QindaQt desktop: the default boot of every Qinda machine.
# A boot mode is one row of the boot menu. Packages add theirs here
# (/usr/share/qinda-boot/modes.d); a file of the same name in
# /etc/qinda-boot/modes.d replaces it, and DISABLED=yes hides it.
#
# TITLE    menu label
# ICON     theme icon: os_<ICON>.png
# OPTIONS  kernel arguments added to the installed kernel's own
TITLE="QindaQt"
ICON="qindaqt"
OPTIONS=""
